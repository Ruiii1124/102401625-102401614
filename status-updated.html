<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>状态已更新 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="success-page">
    <div class="check">✓</div>
    <h2>状态已更新</h2>
    <p id="status-text"></p>
    <button class="btn-primary" onclick="goMyPosts()">返回我的发布</button>
  </div>

  <script src="js/data.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      const params = new URLSearchParams(window.location.search);
      const item = getItemById(params.get('id'));

      const textEl = document.getElementById('status-text');
      if (!item || item.status !== 'resolved') {
        document.querySelector('h2').textContent = '未确认状态更新';
        document.querySelector('.check').textContent = '!';
        textEl.textContent = '没有找到已完成的信息，请返回我的发布核对。';
        return;
      }
      textEl.textContent = `该信息已标记为“${getStatusText(item.type, item.status)}”，并移入“已完成”列表。`;
    });

    function goMyPosts() {
      window.location.href = 'my-posts.html';
    }
  </script>
</body>
</html>
