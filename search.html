<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>搜索物品 - 校园失物招领</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 顶部导航 -->
  <div class="navbar">
    <button class="back-btn" onclick="goBack()">‹</button>
    <span class="title">搜索物品</span>
    <span style="width:28px;"></span>
  </div>

  <div class="page">
    <!-- 搜索框 + 搜索按钮 -->
    <div class="search-bar" style="padding-right:4px;">
      <span class="search-icon">🔍</span>
      <input type="text" id="keyword" placeholder="搜索校园卡、钥匙、耳机……">
      <button class="btn-primary" style="width:auto;padding:8px 16px;font-size:13px;" onclick="doSearch()">搜索</button>
    </div>

    <!-- 信息类型筛选 -->
    <div class="form-group">
      <label>信息类型</label>
      <div class="filter-tabs" id="type-tabs">
        <button class="active" data-type="all" onclick="switchType(this, 'all')">全部</button>
        <button data-type="lost" onclick="switchType(this, 'lost')">寻物</button>
        <button data-type="found" onclick="switchType(this, 'found')">招领</button>
      </div>
    </div>

    <!-- 物品分类筛选 -->
    <div class="form-group">
      <label>物品分类</label>
      <div class="filter-tabs" id="cat-tabs" style="flex-wrap:wrap;">
        <button class="active" data-cat="all" onclick="switchCat(this, 'all')">全部</button>
        <button data-cat="校园卡" onclick="switchCat(this, '校园卡')">校园卡</button>
        <button data-cat="钥匙" onclick="switchCat(this, '钥匙')">钥匙</button>
        <button data-cat="雨伞" onclick="switchCat(this, '雨伞')">雨伞</button>
        <button data-cat="电子产品" onclick="switchCat(this, '电子产品')">电子产品</button>
        <button data-cat="书籍" onclick="switchCat(this, '书籍')">书籍</button>
        <button data-cat="其他" onclick="switchCat(this, '其他')">其他</button>
      </div>
    </div>

    <!-- 状态筛选 -->
    <div class="form-group">
      <label>信息状态</label>
      <div class="filter-tabs" id="status-tabs">
        <button class="active" data-status="all" onclick="switchStatus(this, 'all')">全部</button>
        <button data-status="active" onclick="switchStatus(this, 'active')">进行中</button>
        <button data-status="resolved" onclick="switchStatus(this, 'resolved')">已完成</button>
      </div>
    </div>

    <div class="form-group">
      <label for="location">遗失 / 拾取地点</label>
      <input type="text" id="location" placeholder="地点关键词，如：图书馆；留空不限">
    </div>

    <!-- 搜索历史 -->
    <div class="form-group">
      <label>搜索历史</label>
      <div class="history-list" id="history-list"></div>
    </div>

    <!-- 查看搜索结果按钮 -->
    <button class="btn-primary" onclick="doSearch()">查看搜索结果</button>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/data.js"></script>
  <script src="js/search.js"></script>
</body>
</html>
